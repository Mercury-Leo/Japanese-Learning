# Builds dist/ and publishes it to GitHub Pages. vite.config.js sets base: "./",
# so the same artifact works at a domain root or under the /Japanese-Learning/
# project-site subpath without a rebuild — which is also why there is no
# actions/configure-pages step here: its only job is to hand the build a base
# path this app does not need.
#
# Pages itself must be switched on once by hand, under Settings → Pages → Source
# → GitHub Actions. The workflow token cannot do it: creating a Pages site is an
# admin-scoped endpoint, and asking for it returns "Resource not accessible by
# integration".
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages needs id-token to mint its OIDC deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# A superseded build is never worth finishing, but let a running deploy land.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The conjugation engine is the whole app; a red suite must not reach the phone.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
