<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>言葉帳 · Kotoba-chō</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#e6e9e3" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="言葉帳" />
    <style>
      /* First paint happens before any JS, so the ground colour is duplicated
         here rather than read from a custom property. Kept in step with
         GROUND in src/theme.js. The data-theme guard means an explicit light
         choice does not flash dark on a dark-preferring system. */
      html, body { margin: 0; padding: 0; background: #e6e9e3; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #161917; }
      }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #161917; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
